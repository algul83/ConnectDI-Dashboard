name: Weekly Consolidate CSV

on:
  schedule:
    # 매주 월요일 13:47 KST = 월요일 04:47 UTC
    # raw CSV(stat routine)가 월요일 오전 ~11:30 KST에 Drive에 올라오므로 그 이후에 실행.
    # (이전 06:00 KST 실행은 raw 업로드 전이라 최신 주가 누락됨)
    - cron: '47 4 * * 1'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account file
        run: echo "$GCP_SA_JSON" > /tmp/service-account.json
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

      - name: Run consolidate_weekly.py
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: /tmp/service-account.json
          DRIVE_FOLDER_DI_KEYWORD: 1tsEwHFoQWIIBCVNtCeNKrVjbXAiFGtXK
          DRIVE_FOLDER_PLUS_KEYWORD: 1rYLAKFUNYp7uAf3bNqx4bafZuf3jQDQ7
          DRIVE_FOLDER_CONSOLIDATED: 12Sq6BElubCNMClsBU3R6CxqJ0VcnprEr
        run: python consolidate_weekly.py

      - name: Cleanup
        if: always()
        run: rm -f /tmp/service-account.json

